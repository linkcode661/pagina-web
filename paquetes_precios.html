    <style>

        /* CONTENEDOR DEL MENÚ */

        .menu-desplegable {
            position: relative;
        }

        /* FLECHA */

        .flecha-submenu {
            display: inline-block;
            margin-left: 5px;
            padding: 6px 10px;
            font-size: 18px;
            color: inherit;
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .menu-desplegable:hover .flecha-submenu,
        .menu-desplegable.abierto .flecha-submenu {
            transform: rotate(180deg);
        }

        /* LISTA DESPLEGABLE */

        .submenu-paquetes {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);

            width: 260px;
            max-height: 500px;
            overflow-y: auto;

            background: #171313;

            padding: 10px 0;
            margin: 0;

            list-style: none;
            text-align: center;

            opacity: 0;
            visibility: hidden;

            transition: all 0.3s ease;

            z-index: 99999;
        }

        /* MOSTRAR AL PASAR EL CURSOR */

        .menu-desplegable:hover .submenu-paquetes,
        .menu-desplegable:focus-within .submenu-paquetes {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* OPCIONES */

        .submenu-paquetes li {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .submenu-paquetes li a {
            display: block;
            padding: 12px 10px;

            color: #ffffff;
            font-size: 16px;
            font-weight: 400;

            text-decoration: none;

            transition: all 0.25s ease;
        }

        /* EFECTO AL PASAR EL CURSOR */

        .submenu-paquetes li a:hover {
            color: #c9a36b;
            background: rgba(255,255,255,0.08);
        }

        /* BARRA DE DESPLAZAMIENTO */

        .submenu-paquetes::-webkit-scrollbar {
            width: 5px;
        }

        .submenu-paquetes::-webkit-scrollbar-thumb {
            background: #a98a62;
            border-radius: 10px;
        }

        /* MENÚ EN CELULARES */

        @media (max-width: 768px) {

            .menu-desplegable {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
            }

            .submenu-paquetes {
                position: static;
                display: none;

                width: 100%;
                max-height: 350px;

                transform: none;
                opacity: 1;
                visibility: visible;

                background: #171313;
                box-shadow: none;
            }

            .menu-desplegable:hover .submenu-paquetes,
            .menu-desplegable:focus-within .submenu-paquetes {
                display: none;
            }

            .menu-desplegable.abierto .submenu-paquetes {
                display: block;
            }

        }

    </style>

/* ===================================
   Función para escribir texto seguro
   (hace lo mismo que htmlspecialchars)
=================================== */

function seguro(texto) {
    var div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML.replace(/"/g, "&quot;");
}
